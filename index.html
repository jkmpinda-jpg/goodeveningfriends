<style>
:root{--night-900:#050B1B;--night-800:#0A1330;--line:#1E3060;--gold-500:#D9A441;--gold-300:#F0CE7E;--blue-500:#3B6FE0;--blue-300:#86AAF5;--parchment:#F6F1E6;--mist:#A7B4D1;--mist-dim:#7385A8;
--ff-display:'Cinzel',Georgia,serif;--ff-quote:'Cormorant Garamond',Georgia,serif;--ff-ui:'Inter',system-ui,sans-serif}
*{margin:0;box-sizing:border-box}
html{background:#050B1B;min-height:100%}
body{min-height:100%}
body{background:radial-gradient(120% 90% at 50% 8%,#1B3068 0%,transparent 58%),radial-gradient(90% 70% at 50% 108%,#17264F 0%,transparent 60%),linear-gradient(178deg,#0A1330 0%,#050B1B 55%,#080F27 100%);color:var(--parchment);font-family:var(--ff-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px 40px}
.stars,.rails{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stars{opacity:.55}
.rails{opacity:.9}
.halo{position:absolute;left:50%;top:50%;width:min(1100px,140vw);height:min(560px,70vh);transform:translate(-50%,-56%);border-radius:50%;background:radial-gradient(closest-side,rgba(59,111,224,.22),rgba(59,111,224,.05) 55%,transparent 100%);pointer-events:none}
.z{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.mark{width:clamp(72px,10vw,104px);height:clamp(72px,10vw,104px)}
.gef{font-family:var(--ff-quote);font-style:italic;font-weight:600;font-size:clamp(40px,8.4vw,108px);line-height:1.02;color:var(--parchment);margin-top:22px;text-wrap:balance}
.gef .dot{color:var(--gold-300)}
.rule{height:1px;width:min(420px,64vw);background:linear-gradient(90deg,transparent,var(--gold-500),transparent);margin:26px 0 20px}
.desc{font-family:var(--ff-display);font-weight:600;text-transform:uppercase;letter-spacing:.3em;font-size:clamp(11px,1.6vw,17px);color:var(--mist)}
.intrigue{font-family:var(--ff-display);font-weight:600;text-transform:uppercase;letter-spacing:.34em;font-size:clamp(10px,1.4vw,14px);color:var(--gold-300);margin-top:22px}
.find{margin-top:56px}
.find .kicker{font:600 10.5px var(--ff-ui);letter-spacing:.26em;text-transform:uppercase;color:var(--mist-dim);margin-bottom:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px}
.pills a{display:inline-flex;align-items:center;gap:8px;background:rgba(17,30,69,.62);border:1px solid var(--line);color:var(--parchment);font:600 12px var(--ff-ui);letter-spacing:.06em;padding:8px 14px;border-radius:100px;text-decoration:none;transition:border-color .15s,transform .15s}
.pills a:hover{border-color:var(--gold-500);transform:translateY(-1px)}
.pills a:focus-visible{outline:2px solid var(--gold-300);outline-offset:2px}
.pills a i{width:7px;height:7px;border-radius:50%;background:var(--gold-500);display:inline-block}
.pills a.b i{background:var(--blue-500)}
footer{position:relative;z-index:2;text-align:center;padding:0 20px 34px;color:var(--mist-dim);font-size:12px;letter-spacing:.08em}
footer a{color:var(--mist-dim);text-decoration:none}
/* arrival */
.z>*,.find{opacity:0;transform:translateY(8px);animation:up .9s ease forwards}
.mark{animation-delay:.1s}.gef{animation-delay:.35s}.rule{animation-delay:.7s}.desc{animation-delay:.85s}.intrigue{animation-delay:1.15s}.find{animation-delay:1.5s}
.gef .dot{opacity:0;animation:in .6s ease 1.25s forwards}
.rails path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease .2s forwards}
.rails path.b{animation-delay:.45s}
@keyframes up{to{opacity:1;transform:none}}
@keyframes in{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.z>*,.find,.gef .dot{opacity:1;transform:none;animation:none}.rails path{stroke-dashoffset:0;animation:none}}
</style>
</head>

  <svg class="rails" viewBox="0 0 1200 800" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#D9A441" stop-opacity="0"/><stop offset=".2" stop-color="#F0CE7E"/><stop offset=".8" stop-color="#D9A441"/><stop offset="1" stop-color="#A2761F" stop-opacity="0"/></linearGradient>

    <h1 class="gef">Good evening, friends<span class="dot">.</span></h1>
    <div class="rule"></div>
